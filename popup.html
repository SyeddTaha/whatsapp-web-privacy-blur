<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Privacy Blur</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="shell">
  <header class="popup-header">
    <div class="brand-wrap">
      <div class="brand-icon" aria-hidden="true">
        <svg width="14" height="16" viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="7" width="12" height="8" rx="2" fill="currentColor"/>
          <path d="M4 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <circle cx="7" cy="11" r="1.2" fill="#0a120a"/>
        </svg>
      </div>
      <div class="brand-text">
        <p class="brand-title">Privacy Blur</p>
        <p class="brand-sub">WhatsApp Web Controls</p>
      </div>
    </div>
    <label class="master-toggle" title="Enable or disable all blurring">
      <input type="checkbox" id="toggle-enabled" />
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <main class="popup-body">
    <section class="group card" id="blur-targets">
      <p class="group-label">Blur Targets</p>

      <label class="row" data-key="blurMessages">
        <span class="row-text">
          <span class="row-title">Chat Messages</span>
          <span class="row-sub">Text in the active conversation</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurPreviews">
        <span class="row-text">
          <span class="row-title">Chat Previews</span>
          <span class="row-sub">Last message and timestamp in list</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurMedia">
        <span class="row-text">
          <span class="row-title">Media Thumbnails</span>
          <span class="row-sub">Images and videos in chat</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurGallery">
        <span class="row-text">
          <span class="row-title">Media Gallery</span>
          <span class="row-sub">Lightbox and full-size viewer</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurInput">
        <span class="row-text">
          <span class="row-title">Message Input</span>
          <span class="row-sub">Composer field blur control</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurNames">
        <span class="row-text">
          <span class="row-title">Names</span>
          <span class="row-sub">Contacts and group names</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="blurAvatars">
        <span class="row-text">
          <span class="row-title">Profile Pictures</span>
          <span class="row-sub">Avatars across the page</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </section>

    <section class="group card">
      <p class="group-label">Blur Strength</p>

      <div class="slider-card">
        <div class="slider-head">
          <span class="row-title">Blur Amount</span>
          <span class="slider-value" id="blur-amount-value">8px</span>
        </div>
        <input type="range" id="blur-amount" class="blur-range" min="0" max="20" step="1" value="8" />
        <div class="slider-scale">
          <span>0</span>
          <span>20</span>
        </div>
      </div>
    </section>

    <section class="group card">
      <p class="group-label">Reveal Behaviour</p>

      <label class="row" data-key="noTransition">
        <span class="row-text">
          <span class="row-title">Instant Reveal</span>
          <span class="row-sub">Disable blur animation</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>

      <label class="row" data-key="revealOnAppHover">
        <span class="row-text">
          <span class="row-title">Hover App to Reveal All</span>
          <span class="row-sub">Mouse over page reveals all</span>
        </span>
        <input type="checkbox" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </section>
  </main>

  <footer class="popup-footer">
    <div class="footer-content">
      <span id="status-line">Hover to reveal</span>
      <a href="https://github.com/SyeddTaha" target="_blank" rel="noopener noreferrer" class="footer-link">
        <span class="footer-credit">Taha Jaffri © 2026</span>
      </a>
    </div>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
